openapi: 3.0.3
info:
  title: EcoMetrics API
  version: 1.0.0
  description: API para consultar indicadores macroeconómicos e infracciones ambientales y calcular el riesgo ESG de una empresa.
servers:
  - url: http://localhost:8080
tags:
  - name: Macroeconomía
  - name: Infracciones ambientales
  - name: Riesgo ESG
paths:
  /macroeconomic-data:
    get:
      tags: [Macroeconomía]
      operationId: getMacroeconomicData
      summary: Consulta indicadores macroeconómicos simulados del BCRP
      parameters:
        - name: indicatorCode
          in: query
          required: true
          schema:
            type: string
            enum: [INFLATION, GDP, EXCHANGE_RATE, INTEREST_RATE]
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Serie del indicador para el periodo solicitado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacroeconomicDataResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /environmental-infractions:
    get:
      tags: [Infracciones ambientales]
      operationId: getEnvironmentalInfractions
      summary: Consulta infracciones ambientales simuladas de OEFA
      parameters:
        - name: companyId
          in: query
          required: true
          description: RUC de la empresa (11 dígitos)
          schema:
            type: string
            pattern: '^\\d{11}$'
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Infracciones ambientales asociadas a la empresa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentalInfractionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /esg-risk:
    post:
      tags: [Riesgo ESG]
      operationId: calculateEsgRisk
      summary: Cruza los indicadores macroeconómicos y las infracciones para calcular el riesgo ESG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsgRiskRequest'
      responses:
        '200':
          description: Resultado del cálculo de riesgo ESG
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsgRiskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    BadRequest:
      description: Parámetros o cuerpo de solicitud inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No se encontraron datos para los criterios indicados
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    MacroeconomicDataResponse:
      type: object
      required: [source, indicatorCode, indicatorName, unit, values]
      properties:
        source:
          type: string
          example: BCRP
        indicatorCode:
          type: string
          example: INFLATION
        indicatorName:
          type: string
          example: Índice de precios al consumidor
        unit:
          type: string
          example: percent
        values:
          type: array
          items:
            $ref: '#/components/schemas/MacroeconomicObservation'
    MacroeconomicObservation:
      type: object
      required: [date, value]
      properties:
        date:
          type: string
          format: date
        value:
          type: numberh
          format: double
          example: 3.2
        variationPercent:
          type: number
          format: double
          nullable: true
    EnvironmentalInfractionsResponse:
      type: object
      required: [source, companyId, total, infractions]
      properties:
        source:
          type: string
          example: OEFA
        companyId:
          type: string
          example: '20123456789'
        total:
          type: integer
          minimum: 0
        infractions:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentalInfraction'
    EnvironmentalInfraction:
      type: object
      required: [infractionId, description, severity, status, reportedAt]
      properties:
        infractionId:
          type: string
          example: OEFA-2025-00123
        description:
          type: string
        category:
          type: string
          example: contaminación del agua
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        status:
          type: string
          enum: [UNDER_INVESTIGATION, CONFIRMED, RESOLVED, DISMISSED]
        fineAmount:
          type: number
          format: double
          minimum: 0
          nullable: true
        currency:
          type: string
          example: PEN
        reportedAt:
          type: string
          format: date
    EsgRiskRequest:
      type: object
      required: [companyId, period, indicatorCode]
      properties:
        companyId:
          type: string
          description: RUC de la empresa (11 dígitos)
          pattern: '^\\d{11}$'
          example: '20123456789'
        period:
          $ref: '#/components/schemas/DatePeriod'
        indicatorCode:
          type: string
          enum: [INFLATION, GDP, EXCHANGE_RATE, INTEREST_RATE]
        includeResolvedInfractions:
          type: boolean
          default: false
    DatePeriod:
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    EsgRiskResponse:
      type: object
      required: [companyId, calculatedAt, score, level, factors, summary]
      properties:
        companyId:
          type: string
          example: '20123456789'
        calculatedAt:
          type: string
          format: date-time
        score:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Puntuación de riesgo donde 0 es riesgo mínimo y 100 es riesgo máximo
        level:
          type: string
          enum: [LOW, MODERATE, HIGH, CRITICAL]
        factors:
          $ref: '#/components/schemas/EsgRiskFactors'
        summary:
          type: string
    EsgRiskFactors:
      type: object
      required: [macroeconomic, environmental]
      properties:
        macroeconomic:
          $ref: '#/components/schemas/MacroeconomicRiskFactor'
        environmental:
          $ref: '#/components/schemas/EnvironmentalRiskFactor'
    MacroeconomicRiskFactor:
      type: object
      required: [indicatorCode, indicatorValue, contribution]
      properties:
        indicatorCode:
          type: string
        indicatorValue:
          type: number
          format: double
        contribution:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Contribución del factor a la puntuación de riesgo
    EnvironmentalRiskFactor:
      type: object
      required: [infractionCount, contribution]
      properties:
        infractionCount:
          type: integer
          minimum: 0
        highestSeverity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          nullable: true
        totalFineAmount:
          type: number
          format: double
          minimum: 0
        contribution:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Contribución del factor a la puntuación de riesgo
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
        details:
          type: array
          items:
            type: string