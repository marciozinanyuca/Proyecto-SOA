<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sectores Estratégicos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        h2 { color: #2c3e50; border-bottom: 2px solid #8e44ad; padding-bottom: 10px; }
        .btn-volver { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #8e44ad; font-weight: bold; }
        
        /* Grid para mostrar los 3 microservicios lado a lado */
        .grid-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .panel h3 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        
        /* Colores por entidad */
        .panel.ingemmet h3 { color: #d35400; }
        .panel.osinergmin h3 { color: #2980b9; }
        .panel.oefa h3 { color: #27ae60; }
        
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; font-size: 12px; overflow-x: auto; max-height: 300px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="btn-volver">← Volver al inicio</a>
        <h2>Dashboard de Sectores Estratégicos</h2>
        
        <div class="grid-dashboard">
            <!-- Panel INGEMMET -->
            <div class="panel ingemmet">
                <h3>INGEMMET (Minería)</h3>
                <pre id="data-ingemmet">Consultando API de concesiones mineras...</pre>
            </div>

            <!-- Panel OSINERGMIN -->
            <div class="panel osinergmin">
                <h3>OSINERGMIN (Energía)</h3>
                <pre id="data-osinergmin">Consultando API de concesiones eléctricas...</pre>
            </div>

            <!-- Panel OEFA -->
            <div class="panel oefa">
                <h3>OEFA (Fiscalización)</h3>
                <pre id="data-oefa">Consultando estado ambiental...</pre>
            </div>
        </div>
    </div>

    <script>
        // 1. Petición a INGEMMET
        fetch('/api/ingemmet')
            .then(res => res.json())
            .then(datos => {
                // Extraemos solo los atributos para no mostrar toda la metadata de ArcGIS
                const atributos = datos.features ? datos.features.map(f => f.attributes) : datos;
                document.getElementById('data-ingemmet').textContent = JSON.stringify(atributos, null, 2);
            })
            .catch(() => document.getElementById('data-ingemmet').textContent = 'Error de conexión.');

        // 2. Petición a OSINERGMIN
        fetch('/api/osinergmin')
            .then(res => res.json())
            .then(datos => {
                const atributos = datos.features ? datos.features.map(f => f.attributes) : datos;
                document.getElementById('data-osinergmin').textContent = JSON.stringify(atributos, null, 2);
            })
            .catch(() => document.getElementById('data-osinergmin').textContent = 'Error de conexión.');

        // 3. Petición a OEFA
        fetch('/api/oefa')
            .then(res => res.json())
            .then(datos => {
                document.getElementById('data-oefa').textContent = JSON.stringify(datos, null, 2);
            })
            .catch(() => document.getElementById('data-oefa').textContent = 'Error de conexión.');
    </script>
</body>
</html>
