Actúa como un arquitecto de software. Escribe una especificación OpenAPI 3.0 en formato YAML para el proyecto EcoMetrics. Necesito 3 endpoints: uno para consultar datos macroeconómicos (simulando BCRP), otro para infracciones ambientales (simulando OEFA), y un endpoint POST que cruce ambos datos para calcular un 'Riesgo ESG'. Define los schemas de request y response detalladamente.