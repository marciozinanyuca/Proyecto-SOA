server:
  port: 8081

# Sin configuracion, el nuevo transporte SENACE no realiza HTTP.
# El archivo .env.apis.local NO se importa automaticamente.
external:
  apis:
    senace-base-url: ${SENACE_BASE_URL:}
    senace-auth-key: ${SENACE_AUTH_KEY:}

# HttpClient puede registrar URIs autenticadas incluso con DEBUG/wire.
# Solo se permite la observabilidad sanitizada del transporte SENACE.
logging:
  level:
    org.apache.hc.client5.http: "OFF"
    org.apache.hc.core5.http: "OFF"

spring:
  application:
    name: ecoinvest-soa
  datasource:
    url: jdbc:sqlite:ecoinvest_fallback.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update

resilience4j:
  circuitbreaker:
    instances:
      senace:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      bcrp:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
