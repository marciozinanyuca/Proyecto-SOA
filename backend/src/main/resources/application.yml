server:
  port: 8081

spring:
  application:
    name: ecoinvest-soa
  datasource:
    url: jdbc:sqlite:ecoinvest_fallback.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update

resilience4j:
  circuitbreaker:
    instances:
      senace:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      bcrp:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s